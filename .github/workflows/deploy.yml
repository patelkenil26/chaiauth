name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_all:
        description: "Force rebuild and deploy all containers regardless of changes"
        required: false
        type: boolean
        default: false

jobs:
  validate:
    name: Quality Gate (Types & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm 9
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm exec turbo` (not the root scripts) so no local .env file is needed in CI
      - name: Verify Monorepo Types
        run: pnpm exec turbo run check-types
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.API_DOMAIN }}/api
          NEXT_PUBLIC_OIDC_URL: https://${{ vars.API_DOMAIN }}
          NEXT_PUBLIC_FRONTEND_URL: https://${{ vars.WEB_DOMAIN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

      - name: Verify Monorepo Build
        run: pnpm exec turbo run build
        env:
          NEXT_PUBLIC_API_URL: https://${{ vars.API_DOMAIN }}/api
          NEXT_PUBLIC_OIDC_URL: https://${{ vars.API_DOMAIN }}
          NEXT_PUBLIC_FRONTEND_URL: https://${{ vars.WEB_DOMAIN }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}

  build-and-deploy:
    name: Build & Deploy
    needs: [validate]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Only rebuild the images whose code actually changed
      - name: Detect Changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile.api'
              - '.github/workflows/deploy.yml'
            web:
              - 'apps/web/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'Dockerfile.web'
              - '.github/workflows/deploy.yml'

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Oracle "Always Free" VMs are often ARM (Ampere). Building both keeps either shape working.
      # Set the repo variable DOCKER_PLATFORMS (e.g. linux/amd64) to build only one and go faster.
      - name: Build & Push API Image
        if: ${{ inputs.force_all == true || steps.changes.outputs.api == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.api
          push: true
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/chaiauth-api:latest
          cache-from: type=gha,scope=chaiauth-api
          cache-to: type=gha,mode=max,scope=chaiauth-api

      - name: Build & Push Web Image
        if: ${{ inputs.force_all == true || steps.changes.outputs.web == 'true' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.web
          push: true
          platforms: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
          build-args: |
            NEXT_PUBLIC_API_URL=https://${{ vars.API_DOMAIN }}/api
            NEXT_PUBLIC_OIDC_URL=https://${{ vars.API_DOMAIN }}
            NEXT_PUBLIC_FRONTEND_URL=https://${{ vars.WEB_DOMAIN }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/chaiauth-web:latest
          cache-from: type=gha,scope=chaiauth-web
          cache-to: type=gha,mode=max,scope=chaiauth-web

      # Deploy to the Oracle Cloud VM over SSH
      - name: Deploy to Production Server
        env:
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ vars.SERVER_IP }}
          SSH_USER: ${{ vars.SSH_USER || 'ubuntu' }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          # "true" only on a dedicated VM where ChaiAuth must run its own Caddy on ports 80/443
          BUNDLED_CADDY: ${{ vars.BUNDLED_CADDY || 'false' }}
        run: |
          mkdir -p ~/.ssh

          # Accept either a base64-encoded key or a raw PEM key
          if echo "$SSH_KEY" | grep -q "^LS0t"; then
            echo "$SSH_KEY" | base64 -d > ~/.ssh/id_rsa
          else
            printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          fi
          sed -i -e '$a\' ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $HOME/.ssh/id_rsa"
          REMOTE="$SSH_USER@$SERVER_IP"

          # Ship the compose + proxy config (no git clone / repo access needed on the server)
          ssh $SSH_OPTS "$REMOTE" "mkdir -p ~/chaiauth"
          scp $SSH_OPTS docker-compose.prod.yml Caddyfile "$REMOTE:~/chaiauth/"

          ssh $SSH_OPTS "$REMOTE" "DOCKERHUB_USERNAME=$DOCKERHUB_USERNAME BUNDLED_CADDY=$BUNDLED_CADDY bash -s" << 'EOF'
            set -e
            cd ~/chaiauth

            if [ ! -f .env.production ]; then
              echo "ERROR: ~/chaiauth/.env.production is missing. Create it from .env.production.example (see DEPLOYMENT.md)."
              exit 1
            fi

            # One-time: OIDC signing keys live on the server, outside git and the image
            if [ ! -f cert/private-key.pem ]; then
              echo "Generating OIDC signing keys..."
              mkdir -p cert
              openssl genpkey -algorithm RSA -out cert/private-key.pem -pkeyopt rsa_keygen_bits:2048
              openssl rsa -in cert/private-key.pem -pubout -out cert/public-key.pub
              chmod 644 cert/private-key.pem cert/public-key.pub
            fi

            # Network shared with the reverse proxy (created once, harmless if it exists)
            docker network create shared-proxy >/dev/null 2>&1 || true

            PROFILE=""
            if [ "$BUNDLED_CADDY" = "true" ]; then PROFILE="--profile standalone"; fi
            COMPOSE="docker compose --env-file .env.production -f docker-compose.prod.yml $PROFILE"

            $COMPOSE pull
            $COMPOSE up -d --remove-orphans

            echo "Applying database migrations..."
            $COMPOSE exec -T chaiauth-api pnpm --filter=@repo/database exec drizzle-kit migrate

            docker image prune -f

            $COMPOSE ps
          EOF
